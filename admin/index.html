<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>لوحة التحكم - Elite Inox Et Glass</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
</head>
<body>
  <script>
    CMS.init({
      config: {
        backend: {
          name: "git-gateway",
          branch: "main"
        },
        local_backend: false,
        media_folder: "images",
        public_folder: "/images",
        locale: "ar",
        collections: [
          {
            name: "settings",
            label: "الإعدادات وبيانات الاتصال",
            files: [
              {
                name: "contact",
                label: "بيانات الاتصال والشركة",
                file: "content/contact.json",
                fields: [
                  { label: "اسم الشركة", name: "company_name", widget: "string" },
                  { label: "الشعار الفرعي", name: "tagline", widget: "string" },
                  { label: "رقم الهاتف (للعرض)", name: "phone", widget: "string", hint: "مثال: +213 794 85 22 30" },
                  { label: "واتساب (أرقام فقط بدون +)", name: "whatsapp", widget: "string", hint: "مثال: 213794852230" },
                  { label: "البريد الإلكتروني", name: "email", widget: "string" },
                  { label: "العنوان بالعربية", name: "address_ar", widget: "string" },
                  { label: "العنوان بالفرنسية", name: "address_fr", widget: "string" },
                  { label: "رابط فيسبوك", name: "facebook", widget: "string" }
                ]
              }
            ]
          }
        ]
      }
    });

    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function (user) {
        if (!user) {
          window.netlifyIdentity.on("login", function () {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
